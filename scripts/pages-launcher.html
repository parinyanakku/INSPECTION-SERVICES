<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEAM INSPECTION PRO ELITE</title></head><body style="font:16px system-ui;padding:24px"><h1>TEAM INSPECTION PRO ELITE</h1><p id="status">กำลังเปิดเวอร์ชันที่คุณเลือกไว้…</p><script>
(async()=>{try{const r=await fetch('./release-index.json',{cache:'no-store'});if(!r.ok)throw Error('Release index unavailable');const m=await r.json();const valid=v=>/^v1\.0\.\d+$/.test(v)&&m.releases.some(x=>x.version===v);let selected=localStorage.getItem('tis_preferred_release_v1');if(!selected||!valid(selected)){selected=m.latest;if(!valid(selected))throw Error('Invalid release');localStorage.setItem('tis_preferred_release_v1',selected);}if(!valid(selected))throw Error('Selected version unavailable');location.replace('./versions/'+selected+'/');}catch(e){document.getElementById('status').textContent='ไม่สามารถเปิดเวอร์ชันที่เลือกได้ กรุณาโหลดหน้าใหม่ หรือติดต่อผู้ดูแลระบบ';}})();
</script></body></html>
