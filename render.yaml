services:
  - type: web
    name: inspection-services
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --no-package-lock && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: GEMINI_API_KEY
        sync: false
