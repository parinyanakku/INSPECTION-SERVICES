    @media print {

    /**
     * Compress uploaded image file to JPEG data URL via Canvas to keep localStorage fast
     */
    function compressImageFile(file, maxWidth = 960, quality = 0.76) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const styles = {
        success: 'bg-slate-900 text-white border-emerald-500',
        info: 'bg-blue-950 text-white border-blue-400',
        warning: 'bg-amber-950 text-white border-amber-400',
        danger: 'bg-rose-950 text-white border-rose-400'
      };
      const icons = { success: '✅', info: 'ℹ️', warning: '⚠️', danger: '❌' };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border-l-4 text-xs sm:text-sm font-medium transition-all transform translate-y-2 opacity-0 ${styles[type] || styles.success}`;
      el.innerHTML = `<span class="text-base">${icons[type] || '✅'}</span><span class="flex-1">${escapeHtml(message)}</span>`;
      container.appendChild(el);
      requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3600);
    }

      dialog.innerHTML = html;
      backdrop.classList.remove('hidden');

      pendingConfirmCallback = onConfirm;

      openSubModal(`

      const cb = pendingConfirmCallback;

      if (!src) return;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const lb = document.getElementById('lightboxModal');
        if (lb && !lb.classList.contains('hidden')) {

          return;
        }
        const sub = document.getElementById('subModalBackdrop');
        if (sub && !sub.classList.contains('hidden')) {

          return;
        }
        const main = document.getElementById('modalBackdrop');
        if (main && !main.classList.contains('hidden')) {
          closeModal();
        }
      }
    });

      const box = document.getElementById('apiTestBox');
      if (!box) return;

          headers: { 'Content-Type': 'application/json' },

    async function saveJsonFileWithPickerOrDownload(payloadObj, rawFileName) {
      const cleaned = (rawFileName || getDefaultSaveAsFilename())
        .trim()
        .replace(/[\\/:*?"<>|]/g, '_')
        .replace(/\.json$/i, '');
      const finalName = `${cleaned || 'home_inspection_backup'}.json`;
      const jsonText = JSON.stringify(payloadObj, null, 2);

      if (typeof window.showSaveFilePicker === 'function') {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: finalName,
            types: [{ description: 'JSON Inspection File', accept: { 'application/json': ['.json'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(jsonText);
          await writable.close();
          return { saved: true, fileName: handle.name || finalName };
        } catch (err) {
          if (err && err.name === 'AbortError') return { saved: false, cancelled: true };
        }
      }

      const blob = new Blob([jsonText], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = finalName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return { saved: true, fileName: finalName };
    }

    function handleJsonImportFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          // Case 1: Full backup with projects array
          if (Array.isArray(parsed.projects) && parsed.projects.length > 0) {
            openConfirmModal({
              title: '📂 นำเข้าไฟล์สำรองข้อมูลทั้งหมด',
              message: `พบแฟ้มโครงการทั้งหมด ${parsed.projects.length} แฟ้มในไฟล์ "${file.name}" คุณต้องการนำเข้าและแทนที่คลังแฟ้มโครงการปัจจุบันหรือไม่?`,
              confirmText: 'นำเข้าข้อมูลทั้งหมด',
              confirmStyle: 'primary',
              onConfirm: () => {
                appState.projects = parsed.projects.map(migrateDefectPhotos);
                if (parsed.brand) {
                  const keepKey = appState.brand.geminiApiKey;
                  const keepModel = appState.brand.geminiModel;
                  appState.brand = { ...DEFAULT_BRAND, ...parsed.brand, geminiApiKey: keepKey, geminiModel: keepModel };
                }
                appState.activeProjectId = null;
                saveAllToLocalStorage(false);
                showToast(`นำเข้า ${appState.projects.length} แฟ้มโครงการเรียบร้อยแล้ว`, 'success');
                renderApp();
              }
            });
            return;
          }
          // Case 2: Single project JSON
          const singleProj = parsed.project || (parsed.id && Array.isArray(parsed.floors) ? parsed : null);
          if (singleProj) {
            const migrated = migrateDefectPhotos(singleProj);
            openConfirmModal({
              title: '📂 นำเข้าแฟ้มโครงการเดี่ยว',
              message: `พบแฟ้ม "${migrated.name}" (${(migrated.defects || []).length} รายการ Defect) ต้องการเพิ่มเข้าสู่คลังแฟ้มโครงการของคุณหรือไม่?`,
              confirmText: 'เพิ่มแฟ้มโครงการ',
              confirmStyle: 'primary',
              onConfirm: () => {
                const existsIdx = appState.projects.findIndex(p => p.id === migrated.id);
                if (existsIdx >= 0) {
                  migrated.id = 'proj_' + Date.now();
                }
                appState.projects.unshift(migrated);
                saveAllToLocalStorage(false);
                showToast(`นำเข้าแฟ้ม "${migrated.name}" เรียบร้อยแล้ว`, 'success');
                renderApp();
              }
            });
            return;
          }
          showToast('รูปแบบไฟล์ JSON ไม่ถูกต้องหรือไม่รองรับ', 'danger');
        } catch (err) {
          showToast('ไม่สามารถอ่านไฟล์ JSON ได้: ' + err.message, 'danger');
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function renderProjectCardsInner() {
      const q = (appState.hubSearch || '').trim().toLowerCase();
      const filtered = appState.projects.filter(p =>
        !q ||
        (p.name || '').toLowerCase().includes(q) ||
        (p.houseNo || '').toLowerCase().includes(q) ||
        (p.clientName || '').toLowerCase().includes(q) ||
        (p.address || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        return `
          <div class="col-span-full bg-white rounded-3xl border border-dashed border-slate-300 p-12 text-center text-slate-400">
            <div class="text-4xl mb-2">📂</div>
            <p class="text-sm font-medium">ไม่พบแฟ้มโครงการที่ค้นหา</p>
          </div>
        `;
      }

      return filtered.map(p => {
        const total = p.defects.length;
        const fixed = p.defects.filter(d => d.status === 'แก้ไขแล้ว').length;
        const urgent = p.defects.filter(d => d.severity === 'เร่งด่วน' && d.status !== 'แก้ไขแล้ว').length;
        const pct = total > 0 ? Math.round((fixed / total) * 100) : 0;
        const totalZones = p.floors.reduce((acc, fl) => acc + (fl.zones?.length || 0), 0);

        return `
          <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-5 hover:border-blue-300 hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">

                </span>
                <div class="flex items-center gap-1">
                  <button type="button" onclick="openCreateProjectModal('${p.id}')" class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-500 text-xs" title="แก้ไขข้อมูลโครงการ">✏️</button>
                  <button type="button" onclick="backupSingleProjectJson('${p.id}')" class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-500 text-xs" title="สำรอง JSON เฉพาะแฟ้มนี้">📦</button>

              <p class="text-xs text-slate-500 mt-1">📍 ${escapeHtml(p.address)} • บ้านเลขที่ ${escapeHtml(p.houseNo)}</p>
              <p class="text-xs text-slate-500 mt-0.5">📅 ${escapeHtml(p.inspectionDate || '-')} • 🗺️ ${p.floors.length} ชั้น / ${totalZones} โซน</p>

              <!-- Stats Badges -->
              <div class="grid grid-cols-3 gap-2 mt-4">
                <div class="bg-slate-50 rounded-2xl p-2.5 text-center border border-slate-100">
                  <div class="text-[11px] text-slate-500">ทั้งหมด</div>
                  <div class="text-lg font-extrabold text-slate-900">${total}</div>
                </div>
                <div class="bg-rose-50 rounded-2xl p-2.5 text-center border border-rose-100">
                  <div class="text-[11px] text-rose-600">เร่งด่วน</div>
                  <div class="text-lg font-extrabold text-rose-600">${urgent}</div>
                </div>
                <div class="bg-emerald-50 rounded-2xl p-2.5 text-center border border-emerald-100">
                  <div class="text-[11px] text-emerald-700">แก้ไขแล้ว</div>
                  <div class="text-lg font-extrabold text-emerald-700">${fixed}</div>
                </div>
              </div>

              <!-- Progress Bar -->
              <div class="mt-3">
                <div class="flex justify-between text-[11px] font-semibold text-slate-500 mb-1">
                  <span>ความคืบหน้าการแก้ไข</span>
                  <span>${pct}%</span>
                </div>
                <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div class="h-full bg-emerald-500 rounded-full transition-all" style="width:${pct}%"></div>
                </div>
              </div>
            </div>

            <div class="mt-4 pt-3.5 border-t border-slate-100 flex items-center gap-2">
              <button type="button" onclick="openProject('${p.id}')" class="flex-1 py-2.5 rounded-2xl brand-bg hover:opacity-95 text-white text-sm font-bold shadow-sm transition">
                🎨 เปิดสตูดิโอแปลน & Defect →
              </button>
            </div>
          </div>
        `;
      }).join('');

     *************************************************************************/
    function switchProjectTab(tab) {
      appState.activeTab = tab;
      appState.placingDraftId = null;
      appState.isZoneSetupMode = false;
      renderApp();
    }

    function renderProjectWorkspaceHtml(proj) {
      const total = proj.defects.length;
      const tabs = [
        { id: 'studio', label: '🎨 สตูดิโอแปลนบ้าน & AI' },
        { id: 'list', label: `📋 รายการ Defect (${total})` },
        { id: 'export', label: '📄 ส่งออกรายงาน (PDF / Word / Excel)' }
      ];

      let bodyHtml = '';
      if (appState.activeTab === 'studio') bodyHtml = renderStudioTabHtml(proj);
      else if (appState.activeTab === 'list') bodyHtml = renderDefectListTabHtml(proj);
      else if (appState.activeTab === 'export') bodyHtml = renderExportTabHtml(proj);

      return `
        ${renderGlobalHeader(true)}

        <!-- Active Project Banner + 3 Tabs -->
        <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-5 mb-5">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-4 border-b border-slate-100">
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <h2 class="text-base sm:text-xl font-extrabold text-slate-900">${escapeHtml(proj.name)}</h2>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 font-semibold">บ้านเลขที่ ${escapeHtml(proj.houseNo)}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1">📍 ${escapeHtml(proj.address)} • 📅 ${escapeHtml(proj.inspectionDate)}</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="openCreateProjectModal('${proj.id}')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">✏️ แก้ไขข้อมูลแฟ้ม</button>
              <button type="button" onclick="backupSingleProjectJson('${proj.id}')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">📦 สำรอง JSON แฟ้มนี้</button>
              <button type="button" onclick="saveAllToLocalStorage(true)" class="text-xs px-3.5 py-1.5 rounded-xl brand-bg text-white font-semibold shadow-sm">💾 บันทึก</button>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mt-4">
            ${tabs.map(t => `
              <button type="button" onclick="switchProjectTab('${t.id}')" class="px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold transition ${appState.activeTab === t.id ? 'brand-bg text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
                ${t.label}
              </button>
            `).join('')}
          </div>
        </section>

        ${bodyHtml}
      `;
    }

    /*************************************************************************
     * 8. TAB 1: INTERACTIVE FLOOR PLAN STUDIO + MARKUP CANVAS & AI
     *************************************************************************/
    function selectFloor(floorId) {
      appState.activeFloorId = floorId;
      appState.selectedZoneId = null;
      renderApp();
    }

    function addNewFloor() {
      const proj = getActiveProject();
      if (!proj) return;
      const nextNum = proj.floors.length + 1;
      const newId = 'fl_' + Date.now();
      proj.floors.push({
        id: newId,
        name: `ชั้น ${nextNum}`,
        subtitle: '1 โซน',
        imageUrl: null,
        svgPreset: nextNum % 2 === 1 ? 0 : 1,
        zones: [
          { id: 'z_' + Date.now(), name: `โซนหลัก ชั้น ${nextNum}`, x: 10, y: 10, w: 80, h: 80, bg: '#dbeafe', border: '#2563eb' }
        ]
      });
      appState.activeFloorId = newId;
      saveAllToLocalStorage(false);
      showToast(`เพิ่มแปลน "ชั้น ${nextNum}" เรียบร้อยแล้ว`, 'success');
      renderApp();
    }

    function confirmDeleteActiveFloor() {
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      if (!proj || !fl) return;
      if (proj.floors.length <= 1) {
        showToast('ต้องมีอย่างน้อย 1 ชั้นแปลนในโครงการ', 'warning');
        return;
      }
      const floorDefectsCount = proj.defects.filter(d => d.floorId === fl.id).length;
      openConfirmModal({
        title: `🗑️ ลบแปลน "${fl.name}"`,
        message: `ยืนยันการลบ "${fl.name}" หรือไม่? ${floorDefectsCount > 0 ? `(มีรายการ Defect ${floorDefectsCount} ข้อในชั้นนี้ที่จะถูกลบไปด้วย)` : ''}`,
        confirmText: 'ลบชั้นนี้',
        confirmStyle: 'danger',
        onConfirm: () => {
          proj.floors = proj.floors.filter(f => f.id !== fl.id);
          proj.defects = proj.defects.filter(d => d.floorId !== fl.id);
          appState.activeFloorId = proj.floors[0].id;
          saveAllToLocalStorage(false);
          showToast(`ลบ "${fl.name}" เรียบร้อยแล้ว`, 'info');
          renderApp();
        }
      });
    }

    async function handleFloorImageFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('กรุณาเลือกไฟล์รูปภาพ (JPG, PNG, WEBP)', 'warning');
        return;
      }
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      if (!fl) return;
      try {
        const compressed = await compressImageFile(file, 1400, 0.8);
        fl.imageUrl = compressed;
        saveAllToLocalStorage(false);
        showToast(`อัปโหลดรูปแปลน "${fl.name}" เรียบร้อยแล้ว`, 'success');
        renderApp();
      } catch (e) {
        showToast('ไม่สามารถโหลดรูปแปลนได้', 'danger');
      }
    }

    function onFloorDrop(e) {
      e.preventDefault();
      const stage = document.getElementById('floorStage');
      if (stage) stage.classList.remove('floor-drop-active');
      const file = e.dataTransfer?.files?.[0];
      if (file) handleFloorImageFile(file);
    }

    function toggleZoneSetupMode() {
      appState.isZoneSetupMode = !appState.isZoneSetupMode;
      appState.placingDraftId = null;
      if (appState.isZoneSetupMode) appState.showZoneOverlays = true;
      appState.selectedZoneId = null;
      renderApp();
    }

    function toggleShowZones() {
      appState.showZoneOverlays = !appState.showZoneOverlays;
      renderApp();
    }

    function addZoneToActiveFloor() {
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      if (!fl) return;
      const preset = ZONE_COLOR_PRESETS[fl.zones.length % ZONE_COLOR_PRESETS.length];
      const newZone = {
        id: 'z_' + Date.now(),
        name: `โซนใหม่ ${fl.zones.length + 1}`,
        x: 20, y: 20, w: 35, h: 25,
        bg: preset.bg, border: preset.border
      };
      fl.zones.push(newZone);
      appState.selectedZoneId = newZone.id;
      appState.isZoneSetupMode = true;
      appState.showZoneOverlays = true;
      saveAllToLocalStorage(false);
      renderApp();
    }

    function openEditZoneModal(zoneId) {
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      const z = fl?.zones.find(x => x.id === zoneId);
      if (!z) return;
      openModal(`
        <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
          <h3 class="font-bold text-base">✏️ แก้ไขโซนบนแปลน (${escapeHtml(fl.name)})</h3>
          <button type="button" onclick="closeModal()" class="text-slate-300 hover:text-white text-xl leading-none">&times;</button>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ชื่อโซน</label>
            <input id="ezName" type="text" value="${escapeHtml(z.name)}" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">สีกรอบโซน</label>
            <div class="flex flex-wrap gap-2">
              ${ZONE_COLOR_PRESETS.map((p, idx) => `
                <button type="button" onclick="applyZoneColorPreset('${z.id}', ${idx})" class="px-3 py-1.5 rounded-xl text-xs font-bold border-2 transition" style="background:${p.bg}; border-color:${p.border}; color:${p.border};">
                  ${p.label}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between">
          <button type="button" onclick="deleteZoneFromActiveFloor('${z.id}')" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold">🗑️ ลบโซนนี้</button>
          <div class="flex gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 text-sm font-semibold">ปิด</button>
            <button type="button" onclick="saveZoneNameEdit('${z.id}')" class="px-5 py-2 rounded-xl brand-bg text-white text-sm font-semibold">บันทึก</button>
          </div>
        </div>
      `, 'max-w-md');
    }

    function applyZoneColorPreset(zoneId, presetIdx) {
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      const z = fl?.zones.find(x => x.id === zoneId);
      const p = ZONE_COLOR_PRESETS[presetIdx];
      if (!z || !p) return;
      z.bg = p.bg;
      z.border = p.border;
      saveAllToLocalStorage(false);
      renderApp();
      showToast('เปลี่ยนสีโซนแล้ว', 'success');
    }

    function saveZoneNameEdit(zoneId) {
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      const z = fl?.zones.find(x => x.id === zoneId);
      const newName = (document.getElementById('ezName')?.value || '').trim();
      if (!z || !newName) return;
      const oldName = z.name;
      z.name = newName;
      proj.defects.forEach(d => {
        if (d.floorId === fl.id && d.zone === oldName) d.zone = newName;
      });
      saveAllToLocalStorage(false);
      closeModal();
      renderApp();
    }

    function deleteZoneFromActiveFloor(zoneId) {
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      if (!fl) return;
      fl.zones = fl.zones.filter(z => z.id !== zoneId);
      appState.selectedZoneId = null;
      saveAllToLocalStorage(false);
      closeModal();
      showToast('ลบโซนเรียบร้อยแล้ว', 'info');
      renderApp();
    }

    function findZoneAtPoint(floor, xPct, yPct) {
      if (!floor || !Array.isArray(floor.zones)) return null;
      return floor.zones.find(z => xPct >= z.x && xPct <= (z.x + z.w) && yPct >= z.y && yPct <= (z.y + z.h)) || null;
    }

    function getPinColorClass(d) {
      if (d.status === 'แก้ไขแล้ว') return 'bg-emerald-600 border-white';
      if (d.severity === 'เร่งด่วน') return 'bg-rose-600 border-white';
      if (d.severity === 'เล็กน้อย') return 'bg-blue-600 border-white';
      return 'bg-amber-500 border-white';
    }

    function renderStudioTabHtml(proj) {
      const fl = getActiveFloor(proj);
      const floorDefects = fl ? proj.defects.filter(d => d.floorId === fl.id) : [];
      const isPlacing = Boolean(appState.placingDraftId);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <!-- LEFT COLUMN (7/12): Interactive Floor Plan Studio -->

                  return `

                      ${escapeHtml(f.name)} <span class="opacity-80 text-[11px]">(${cnt})</span>

                ${proj.floors.length > 1 ? `<button type="button" onclick="confirmDeleteActiveFloor()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600" title="ลบชั้นปัจจุบัน">🗑️ ลบชั้น</button>` : ''}
              </div>
            </div>

            <!-- Action Controls -->
            <div class="flex flex-wrap items-center gap-2 mb-3 pb-3 border-b border-slate-100">
              <label class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold cursor-pointer transition flex items-center gap-1.5">

                <input type="file" accept="image/*" class="hidden" onchange="if(this.files[0]) handleFloorImageFile(this.files[0]); this.value='';" />
              </label>
              <button type="button" onclick="toggleZoneSetupMode()" class="text-xs px-3 py-1.5 rounded-xl font-semibold transition flex items-center gap-1.5 ${appState.isZoneSetupMode ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 hover:bg-slate-200 text-slate-800'}">
                ⚙️ ${appState.isZoneSetupMode ? 'เสร็จสิ้นตั้งค่าโซน' : 'ตั้งค่าโซน'}

              <button type="button" onclick="toggleShowZones()" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold transition">
                👁️ ${appState.showZoneOverlays ? 'ซ่อนกรอบโซน' : 'แสดงกรอบโซน'}
              </button>
              ${appState.isZoneSetupMode ? `
                <button type="button" onclick="addZoneToActiveFloor()" class="text-xs px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-sm">
                  + เพิ่มโซนใหม่
                </button>
              ` : ''}
            </div>

            <!-- Banner for Placing Mode or Zone Setup Mode -->
            ${isPlacing ? `
              <div class="mb-3 p-3 rounded-2xl bg-blue-50 border-2 border-blue-400 flex items-center justify-between gap-2 animate-pulse">
                <span class="text-xs sm:text-sm font-bold text-blue-900">📍 โหมดปักหมุดกำลังทำงาน: คลิกบนตำแหน่งที่ต้องการบนแปลน "${escapeHtml(fl?.name || '')}"</span>
                <button type="button" onclick="cancelPinPlacement()" class="text-xs px-3 py-1 rounded-xl bg-white border border-blue-300 text-blue-800 font-bold">ยกเลิก</button>

            ${appState.isZoneSetupMode ? `
              <div class="mb-3 p-3 rounded-2xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900 flex flex-wrap items-center justify-between gap-2">
                <span>⚙️ <strong>โหมดตั้งค่าโซน:</strong> ลากกล่องเพื่อย้าย • ลากมุมขวาล่าง (↘) เพื่อย่อขยาย • ดับเบิลคลิกหรือกดปุ่ม ✏️ เพื่อแก้ไขชื่อ/สี/ลบโซน</span>

              onclick="handleFloorStageClick(event)"

                >
                  <div class="inline-flex items-center gap-1 px-2 py-0.5 m-1 rounded-lg text-[10px] sm:text-[11px] font-bold shadow-xs max-w-[92%] truncate" style="background:${z.border}; color:#ffffff;">

                    ${appState.isZoneSetupMode ? `<button type="button" onclick="event.stopPropagation(); openEditZoneModal('${z.id}')" class="ml-1 px-1 bg-white/25 hover:bg-white/40 rounded text-[10px]">✏️</button>` : ''}
                  </div>
                  ${appState.isZoneSetupMode ? `<div class="zone-resize-handle" onpointerdown="event.stopPropagation(); startZoneDrag(event, '${z.id}', 'resize')">↘</div>` : ''}
                </div>
              `).join('') : ''}

              <!-- Defect Pins Layer -->
              ${!appState.isZoneSetupMode ? floorDefects.map(d => `
                <button
                  type="button"

                  onpointerdown="startPinDrag(event, '${d.id}')"
                  onclick="event.stopPropagation(); handlePinClick('${d.id}')"

                  class="pin-marker absolute z-20 w-7 h-7 sm:w-8 sm:h-8 rounded-full text-white text-[11px] sm:text-xs font-extrabold border-2 shadow-md flex items-center justify-center ${getPinColorClass(d)}"

                  ${d.number}

            <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500">

                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span> แก้ไขแล้ว</span>
              </div>
              <span>💡 ลากหมุดเพื่อย้ายตำแหน่ง • คลิกหมุดเพื่อดู/แนบรูป Before-After</span>
            </div>
          </div>

          <!-- RIGHT COLUMN (5/12): Photo Markup Canvas & AI Defect Analyzer -->
          <div class="lg:col-span-5 space-y-4">

            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-5">
              <div class="flex items-center justify-between gap-2 mb-3">

                  <button type="button" onclick="setMarkupTool('arrow')" class="px-2.5 py-1 rounded-xl text-xs font-bold transition ${appState.markup.tool === 'arrow' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200'}">↗️ ลูกศร</button>

                  ${appState.markup.imageSrc ? `<button type="button" onclick="clearMarkupImage()" class="px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold" title="ลบรูป">🗑️</button>` : ''}

    /*************************************************************************
     * 9. FLOORPLAN INTERACTIONS (PIN PLACEMENT, PIN DRAG, ZONE MOVE/RESIZE)
     *************************************************************************/
    function startPinPlacement(draftId) {
      appState.isZoneSetupMode = false;
      appState.placingDraftId = appState.placingDraftId === draftId ? null : draftId;
      renderApp();
      if (appState.placingDraftId) {
        showToast('คลิกตำแหน่งที่ต้องการบนแปลนชั้นปัจจุบันเพื่อปักหมุด', 'info');
      }
    }

    function cancelPinPlacement() {
      appState.placingDraftId = null;
      renderApp();
    }

    function handleFloorStageClick(event) {
      if (!appState.placingDraftId || appState.isZoneSetupMode) return;
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      const draft = appState.drafts.find(d => d.id === appState.placingDraftId);
      if (!proj || !fl || !draft) return;

      const stage = document.getElementById('floorStage');
      const rect = stage.getBoundingClientRect();
      const xPct = Math.max(2, Math.min(98, +(((event.clientX - rect.left) / rect.width) * 100).toFixed(2)));
      const yPct = Math.max(2, Math.min(98, +(((event.clientY - rect.top) / rect.height) * 100).toFixed(2)));

      const matchedZone = findZoneAtPoint(fl, xPct, yPct);
      const nextNum = proj.defects.length > 0 ? Math.max(...proj.defects.map(d => d.number || 0)) + 1 : 1;

      const newDefect = {
        id: 'def_' + Date.now(),
        number: nextNum,
        floorId: fl.id, // Always stays on activeFloorId!
        zone: matchedZone ? matchedZone.name : (fl.zones[0]?.name || fl.name),
        x: xPct,
        y: yPct,
        title: (draft.title || '').trim() || `รายการ Defect ข้อที่ ${nextNum}`,
        cause: draft.hideCause ? '' : (draft.cause || ''),
        solution: draft.hideSolution ? '' : (draft.solution || ''),
        hideCause: Boolean(draft.hideCause),
        hideSolution: Boolean(draft.hideSolution),
        severity: normalizeSeverity(draft.severity),
        status: 'รอแก้ไข',
        beforeImg: draft.photoDataUrl || null,
        afterImg: null,
        createdAt: new Date().toISOString().split('T')[0]
      };

      proj.defects.push(newDefect);
      appState.drafts = appState.drafts.filter(d => d.id !== draft.id);
      appState.placingDraftId = null;
      saveAllToLocalStorage(false);
      showToast(`ปักหมุดข้อที่ #${nextNum} ลงบน "${fl.name}" เรียบร้อยแล้ว`, 'success');
      renderApp();
    }

    function startPinDrag(event, defectId) {
      if (appState.isZoneSetupMode || appState.placingDraftId) return;
      event.stopPropagation();
      appState.draggingDefectId = defectId;
      appState.pinDragMoved = false;
      appState.pinDragStartX = event.clientX;
      appState.pinDragStartY = event.clientY;
    }

    function handlePinClick(defectId) {
      if (appState.pinDragMoved) {
        appState.pinDragMoved = false;
        return;
      }
      openDefectEditModal(defectId);
    }

    function startZoneDrag(event, zoneId, mode) {
      if (!appState.isZoneSetupMode) return;
      event.stopPropagation();
      const proj = getActiveProject();
      const fl = getActiveFloor(proj);
      const z = fl?.zones.find(item => item.id === zoneId);
      if (!z) return;
      appState.selectedZoneId = zoneId;
      appState.zoneInteraction = {
        zoneId,
        mode,
        startX: event.clientX,
        startY: event.clientY,
        origX: z.x,
        origY: z.y,
        origW: z.w,
        origH: z.h
      };
    }

    window.addEventListener('pointermove', (event) => {
      const stage = document.getElementById('floorStage');
      if (!stage) return;

      // Pin Dragging
      if (appState.draggingDefectId) {
        const dx = Math.abs(event.clientX - appState.pinDragStartX);
        const dy = Math.abs(event.clientY - appState.pinDragStartY);
        if (dx > 4 || dy > 4) appState.pinDragMoved = true;
        if (!appState.pinDragMoved) return;

        const rect = stage.getBoundingClientRect();
        const xPct = Math.max(2, Math.min(98, +(((event.clientX - rect.left) / rect.width) * 100).toFixed(2)));
        const yPct = Math.max(2, Math.min(98, +(((event.clientY - rect.top) / rect.height) * 100).toFixed(2)));

        const proj = getActiveProject();
        const d = proj?.defects.find(item => item.id === appState.draggingDefectId);
        if (d) {
          d.x = xPct;
          d.y = yPct;
          const pinEl = stage.querySelector(`[data-defect-id="${d.id}"]`);
          if (pinEl) {
            pinEl.style.left = xPct + '%';
            pinEl.style.top = yPct + '%';
          }
        }
        return;
      }

      // Zone Move / Resize
      if (appState.zoneInteraction) {
        const zi = appState.zoneInteraction;
        const rect = stage.getBoundingClientRect();
        const dxPct = ((event.clientX - zi.startX) / rect.width) * 100;
        const dyPct = ((event.clientY - zi.startY) / rect.height) * 100;

        const proj = getActiveProject();
        const fl = getActiveFloor(proj);
        const z = fl?.zones.find(item => item.id === zi.zoneId);
        if (!z) return;

        if (zi.mode === 'move') {
          z.x = Math.max(0, Math.min(100 - z.w, +(zi.origX + dxPct).toFixed(1)));
          z.y = Math.max(0, Math.min(100 - z.h, +(zi.origY + dyPct).toFixed(1)));
        } else if (zi.mode === 'resize') {
          z.w = Math.max(10, Math.min(100 - z.x, +(zi.origW + dxPct).toFixed(1)));
          z.h = Math.max(8, Math.min(100 - z.y, +(zi.origH + dyPct).toFixed(1)));
        }

        const boxEl = stage.querySelector(`[data-zone-id="${z.id}"]`);
        if (boxEl) {
          boxEl.style.left = z.x + '%';
          boxEl.style.top = z.y + '%';
          boxEl.style.width = z.w + '%';
          boxEl.style.height = z.h + '%';
        }
      }
    });

    window.addEventListener('pointerup', () => {
      if (appState.draggingDefectId) {
        if (appState.pinDragMoved) {
          const proj = getActiveProject();
          const fl = getActiveFloor(proj);
          const d = proj?.defects.find(item => item.id === appState.draggingDefectId);
          if (d && fl) {
            const matched = findZoneAtPoint(fl, d.x, d.y);
            if (matched) d.zone = matched.name;
          }
          saveAllToLocalStorage(false);
          showToast('ย้ายตำแหน่งหมุดเรียบร้อยแล้ว', 'success');
        }
        appState.draggingDefectId = null;
      }

      if (appState.zoneInteraction) {
        appState.zoneInteraction = null;
        saveAllToLocalStorage(false);
      }
    });

    async function handleMarkupPhotoUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const compressed = await compressImageFile(file, 960, 0.8);
        appState.markup.imageSrc = compressed;
        appState.markup.fileName = file.name;
        appState.markup.shapes = [];
        loadedMarkupImageObj = new Image();
        loadedMarkupImageObj.onload = () => {
          renderApp();
        };
        loadedMarkupImageObj.src = compressed;
      } catch (e) {
        showToast('ไม่สามารถอ่านไฟล์รูปภาพได้', 'danger');
      }
      event.target.value = '';
    }

    function setMarkupTool(tool) {
      appState.markup.tool = tool;
      renderApp();
    }

    function undoMarkupShape() {
      appState.markup.shapes.pop();
      redrawMarkupCanvas();
    }

    function clearMarkupShapes() {
      appState.markup.shapes = [];
      redrawMarkupCanvas();
    }

    function clearMarkupImage() {
      appState.markup.imageSrc = null;
      appState.markup.shapes = [];
      loadedMarkupImageObj = null;
      renderApp();
    }

    function bindMarkupCanvasEvents() {
      const canvas = document.getElementById('markupCanvas');
      const wrap = document.getElementById('markupCanvasWrap');
      if (!canvas || !wrap || !appState.markup.imageSrc) return;

      canvas.width = wrap.clientWidth || 480;
      canvas.height = wrap.clientHeight || 360;

      if (!loadedMarkupImageObj || loadedMarkupImageObj.src !== appState.markup.imageSrc) {
        loadedMarkupImageObj = new Image();
        loadedMarkupImageObj.onload = () => redrawMarkupCanvas();
        loadedMarkupImageObj.src = appState.markup.imageSrc;
      } else {
        redrawMarkupCanvas();
      }

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - rect.left) / rect.width) * canvas.width,
          y: ((e.clientY - rect.top) / rect.height) * canvas.height
        };
      };

      canvas.onpointerdown = (e) => {
        canvas.setPointerCapture(e.pointerId);
        const pos = getPos(e);
        appState.markup.isDrawing = true;
        appState.markup.currentShape = {
          tool: appState.markup.tool,
          color: appState.markup.color,
          lineWidth: appState.markup.lineWidth,
          x1: pos.x / canvas.width,
          y1: pos.y / canvas.height,
          x2: pos.x / canvas.width,
          y2: pos.y / canvas.height
        };
      };

      canvas.onpointermove = (e) => {
        if (!appState.markup.isDrawing || !appState.markup.currentShape) return;
        const pos = getPos(e);
        appState.markup.currentShape.x2 = pos.x / canvas.width;
        appState.markup.currentShape.y2 = pos.y / canvas.height;
        redrawMarkupCanvas();
      };

      canvas.onpointerup = () => {
        if (!appState.markup.isDrawing || !appState.markup.currentShape) return;
        const s = appState.markup.currentShape;
        if (Math.hypot(s.x2 - s.x1, s.y2 - s.y1) > 0.015) {
          appState.markup.shapes.push(s);
        }
        appState.markup.isDrawing = false;
        appState.markup.currentShape = null;
        redrawMarkupCanvas();
      };
    }

    function drawShapeOnCtx(ctx, s, w, h) {
      const x1 = s.x1 * w, y1 = s.y1 * h, x2 = s.x2 * w, y2 = s.y2 * h;
      ctx.save();
      ctx.strokeStyle = s.color || '#ef4444';
      ctx.fillStyle = s.color || '#ef4444';
      ctx.lineWidth = s.lineWidth || 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (s.tool === 'circle') {
        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;
        const rx = Math.abs(x2 - x1) / 2;
        const ry = Math.abs(y2 - y1) / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(4, rx), Math.max(4, ry), 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (s.tool === 'rect') {
        ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
      } else if (s.tool === 'arrow') {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const headLen = 14;
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function redrawMarkupCanvas() {
      const canvas = document.getElementById('markupCanvas');
      if (!canvas || !loadedMarkupImageObj || !loadedMarkupImageObj.complete) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      // Fit image preserving aspect ratio
      const imgRatio = loadedMarkupImageObj.width / loadedMarkupImageObj.height;
      const canRatio = w / h;
      let dw = w, dh = h, dx = 0, dy = 0;
      if (imgRatio > canRatio) {
        dh = w / imgRatio;
        dy = (h - dh) / 2;
      } else {
        dw = h * imgRatio;
        dx = (w - dw) / 2;
      }
      ctx.drawImage(loadedMarkupImageObj, dx, dy, dw, dh);

      appState.markup.shapes.forEach(s => drawShapeOnCtx(ctx, s, w, h));
      if (appState.markup.currentShape) drawShapeOnCtx(ctx, appState.markup.currentShape, w, h);
    }

    function exportMarkedPhotoDataUrl() {
      if (!appState.markup.imageSrc) return null;
      const canvas = document.getElementById('markupCanvas');
      if (canvas && canvas.width > 0 && appState.markup.shapes.length > 0) {
        try { return canvas.toDataURL('image/jpeg', 0.8); } catch (e) {}
      }
      return appState.markup.imageSrc;
    }

    /**
     * แปลงผลลัพธ์ JSON จาก Gemini AI อย่างปลอดภัย
     * รองรับทั้ง JSON ปกติ, ล้าง Markdown fence, แก้ไข newline ในข้อความ
     * และดึงค่าแต่ละฟิลด์สำรองกรณีข้อความถูกตัดกลางประโยคหรือมีเครื่องหมายคำพูดซ้อน
     */
    function parseAiDefectJson(rawText) {
      if (!rawText || typeof rawText !== 'string') {
        throw new Error('AI ไม่ได้ส่งข้อความผลลัพธ์กลับมา');
      }

      // 1. ลบเครื่องหมาย ```json ... ``` ที่อาจติดมา
      let cleaned = rawText
        .replace(/^```(?:json)?\s*/i, '')
        .replace(/\s*```$/i, '')
        .trim();

      // ลองแปลง JSON ตรงๆ ก่อน
      try {
        return JSON.parse(cleaned);
      } catch (_) {}

      // 2. ดึงเฉพาะส่วนที่อยู่ในปีกกา { ... } และจัดรูป newline/control chars
      const firstBrace = cleaned.indexOf('{');
      const lastBrace = cleaned.lastIndexOf('}');
      if (firstBrace !== -1) {
        let candidate = lastBrace > firstBrace
          ? cleaned.slice(firstBrace, lastBrace + 1)
          : cleaned.slice(firstBrace);

        // แทนที่การขึ้นบรรทัดใหม่ดิบๆ ด้วยช่องว่างเพื่อไม่ให้เกิด Unterminated string
        const sanitized = candidate.replace(/[\u0000-\u001F]+/g, ' ');
        try {
          return JSON.parse(sanitized);
        } catch (_) {}
      }

      // 3. Fallback: ดึงค่าทีละฟิลด์ด้วย Regex กรณี JSON ถูกตัดกลางคันหรือมี " ซ้อนภายในข้อความภาษาไทย
      const extractField = (key, nextKeys) => {
        const nextPattern = nextKeys.length > 0
          ? `(?="\\s*,\\s*"(?:${nextKeys.join('|')})"\\s*:|"\\s*\\}|$)`
          : `(?="\\s*\\}|$)`;
        const re = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)${nextPattern}`, 'i');
        const m = cleaned.match(re);
        if (!m) return '';
        return m[1]
          .replace(/\\n/g, ' ')
          .replace(/\\"/g, '"')
          .replace(/"\s*$/, '')
          .trim();
      };

      const fallbackObj = {
        title: extractField('title', ['severity', 'cause', 'solution']),
        severity: extractField('severity', ['cause', 'solution', 'title']),
        cause: extractField('cause', ['solution', 'severity', 'title']),
        solution: extractField('solution', ['title', 'severity', 'cause'])
      };

      if (fallbackObj.title || fallbackObj.cause || fallbackObj.solution) {
        return fallbackObj;
      }

      throw new Error('ไม่สามารถแปลงผลลัพธ์จาก AI เป็น JSON ได้ กรุณาลองกดวิเคราะห์ใหม่อีกครั้ง');
    }

    async function analyzeMarkupWithAI() {
      const apiKey = (appState.brand.geminiApiKey || '').trim();
      if (!apiKey) {
        showToast('กรุณาตั้งค่า Gemini API Key ก่อนใช้งาน AI วิเคราะห์ภาพ', 'warning');
        openApiKeyModal('ยังไม่ได้ตั้งค่า Gemini API Key กรุณากรอกคีย์ด้านล่าง หรือกด "อ่านขั้นตอนการรับ API Key" เพื่อขอคีย์ฟรี');
        return;
      }

      const photoDataUrl = exportMarkedPhotoDataUrl();
      if (!photoDataUrl) {
        showToast('กรุณาอัปโหลดรูปภาพหน้างานก่อนกดวิเคราะห์ด้วย AI', 'warning');
        return;
      }

      appState.isAnalyzing = true;
      renderApp();

      const model = appState.brand.geminiModel || 'gemini-2.5-flash';
      const base64Data = photoDataUrl.split(',')[1];
      const userNote = (appState.aiPrompt || '').trim();

      const systemPrompt = `คุณคือวิศวกรโยธาผู้เชี่ยวชาญการตรวจรับบ้าน (Home Inspector) วิเคราะห์ภาพถ่ายหน้างานนี้ (หากมีวงกลม/ลูกศรหรือกรอบสีแดงให้โฟกัสที่จุดนั้นเป็นหลัก) ${userNote ? `ข้อมูลเพิ่มเติมจากผู้ตรวจ: "${userNote}"` : ''}
ตอบกลับเป็น JSON Object ภาษาไทยที่กระชับ ชัดเจน ไม่ใช้เครื่องหมายคำพูดซ้อนในเนื้อหา ตามโครงสร้าง:
- title: ชื่อรายการ Defect สั้นกระชับชัดเจน
- severity: เลือก 1 ค่าจาก "เร่งด่วน", "ปานกลาง", "เล็กน้อย"
- cause: สาเหตุทางวิศวกรรมที่ทำให้เกิดปัญหานี้ (1-2 ประโยค)
- solution: วิธีแก้ไขที่ถูกต้องตามมาตรฐานงานช่าง (1-2 ประโยค)`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: systemPrompt },
                { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
              ]
            }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  title: { type: 'STRING' },
                  severity: { type: 'STRING', enum: ['เร่งด่วน', 'ปานกลาง', 'เล็กน้อย'] },
                  cause: { type: 'STRING' },
                  solution: { type: 'STRING' }
                },
                required: ['title', 'severity', 'cause', 'solution']
              },
              temperature: 0.2,
              maxOutputTokens: 2048
            }
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const errMsg = data?.error?.message || `HTTP ${res.status}`;
          const isKeyError = res.status === 400 || res.status === 403 || /API_KEY_INVALID|API key not valid/i.test(errMsg);
          appState.isAnalyzing = false;
          renderApp();
          if (isKeyError) {
            showToast('API Key ไม่ถูกต้องหรือหมดอายุ กรุณาตรวจสอบและตั้งค่าใหม่', 'danger');
            openApiKeyModal(`เกิดข้อผิดพลาด (HTTP ${res.status}): API Key ไม่ถูกต้อง กรุณาตรวจสอบรหัสคีย์แล้วบันทึกใหม่อีกครั้ง`);
            return;
          }
          throw new Error(errMsg);
        }

        // รวมข้อความจากทุก part ที่ไม่ใช่ thought block
        const parts = data?.candidates?.[0]?.content?.parts || [];
        const rawText = parts
          .filter(p => !p.thought && typeof p.text === 'string')
          .map(p => p.text)
          .join('\n')
          .trim();

        const parsed = parseAiDefectJson(rawText);

        appState.drafts.unshift({
          id: 'dr_' + Date.now(),
          fromAI: true,
          title: parsed.title || 'จุดบกพร่องที่ตรวจพบ',
          severity: normalizeSeverity(parsed.severity),
          cause: parsed.cause || '',
          solution: parsed.solution || '',
          hideCause: false,
          hideSolution: false,
          photoDataUrl
        });

        appState.isAnalyzing = false;
        showToast('AI วิเคราะห์ภาพเสร็จสิ้น! กด "📍 ปักหมุดข้อนี้ลงแปลน" เพื่อบันทึกได้เลย', 'success');
        renderApp();
      } catch (err) {
        appState.isAnalyzing = false;
        renderApp();
        showToast('วิเคราะห์ภาพไม่สำเร็จ: ' + err.message, 'danger');
      }
    }

      appState[key] = value;

    function getFloorNameById(proj, floorId) {
      return proj.floors.find(f => f.id === floorId)?.name || 'ชั้น 1';
    }

      const q = (appState.listSearch || '').trim().toLowerCase();

        .filter(d => {
          if (appState.listFloorFilter !== 'all' && d.floorId !== appState.listFloorFilter) return false;
          if (appState.listZoneFilter !== 'all' && d.zone !== appState.listZoneFilter) return false;
          if (appState.listSeverityFilter !== 'all' && d.severity !== appState.listSeverityFilter) return false;
          if (appState.listStatusFilter !== 'all' && d.status !== appState.listStatusFilter) return false;
          if (q) {
            const hay = `#${d.number} ${d.title} ${d.zone} ${d.cause} ${d.solution}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => (a.number || 0) - (b.number || 0));

      if (filtered.length === 0) {
        return `

            <p class="text-sm font-semibold">ไม่พบรายการ Defect ตามเงื่อนไขที่เลือก</p>

        const floorName = getFloorNameById(proj, d.floorId);
        return `

            <div>
              <div class="flex items-start justify-between gap-2 mb-2.5">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-slate-900 text-white">#${d.number}</span>
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-lg ${getSeverityBadgeCls(d.severity)}">${escapeHtml(d.severity)}</span>
                  <button type="button" onclick="quickCycleDefectStatus('${d.id}')" title="คลิกเพื่อสลับสถานะ" class="text-xs font-bold px-2.5 py-0.5 rounded-lg border transition ${getStatusBadgeCls(d.status)}">
                    ${escapeHtml(d.status)}
                  </button>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" onclick="openDefectEditModal('${d.id}')" class="text-xs px-2.5 py-1 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold">✏️ แก้ไข / รูปภาพ</button>
                  <button type="button" onclick="confirmDeleteDefect('${d.id}')" class="text-xs px-2 py-1 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600">🗑️</button>

              </div>

              <h4 class="font-extrabold text-slate-900 text-sm sm:text-base leading-snug">${escapeHtml(d.title)}</h4>
              <p class="text-xs text-slate-500 mt-1">🗺️ ${escapeHtml(floorName)} • 📍 ${escapeHtml(d.zone)}</p>

              ${(!d.hideCause && d.cause) ? `

    async function quickUploadDefectPhoto(event, defectId, field) {
      const file = event.target.files?.[0];
      if (!file) return;
      const proj = getActiveProject();
      const d = proj?.defects.find(x => x.id === defectId);
      if (!d) return;
      try {
        d[field] = await compressImageFile(file, 960, 0.75);
        saveAllToLocalStorage(false);
        showToast(field === 'beforeImg' ? 'แนบรูปก่อนแก้ไข (Before) เรียบร้อยแล้ว' : 'แนบรูปหลังแก้ไข (After) เรียบร้อยแล้ว', 'success');
        const grid = document.getElementById('defectCardsGrid');
        if (grid) grid.innerHTML = renderDefectCardsInner(proj);
      } catch (e) {
        showToast('ไม่สามารถอัปโหลดรูปภาพได้', 'danger');
      }
      event.target.value = '';
    }

    function quickCycleDefectStatus(defectId) {
      const proj = getActiveProject();
      const d = proj?.defects.find(x => x.id === defectId);
      if (!d) return;
      const order = ['รอแก้ไข', 'กำลังแก้ไข', 'แก้ไขแล้ว'];
      const nextIdx = (order.indexOf(d.status) + 1) % order.length;
      d.status = order[nextIdx];
      saveAllToLocalStorage(false);
      const grid = document.getElementById('defectCardsGrid');
      if (grid) grid.innerHTML = renderDefectCardsInner(proj);
      showToast(`เปลี่ยนสถานะข้อ #${d.number} เป็น "${d.status}"`, 'info');
    }

    function confirmDeleteDefect(defectId) {
      const proj = getActiveProject();
      const d = proj?.defects.find(x => x.id === defectId);
      if (!d) return;
      openConfirmModal({
        title: `🗑️ ลบรายการ Defect ข้อที่ #${d.number}`,
        message: `ยืนยันการลบรายการ "${d.title}" ออกจากโครงการนี้หรือไม่?`,
        confirmText: 'ลบรายการ',
        confirmStyle: 'danger',
        onConfirm: () => {
          proj.defects = proj.defects.filter(x => x.id !== defectId);
          saveAllToLocalStorage(false);
          closeModal();
          showToast('ลบรายการ Defect เรียบร้อยแล้ว', 'info');
          renderApp();
        }
      });
    }

    function openDefectEditModal(defectId = null) {
      const proj = getActiveProject();
      if (!proj) return;
      const d = defectId ? proj.defects.find(x => x.id === defectId) : null;
      const defaultFloor = d ? d.floorId : (getActiveFloor(proj)?.id || proj.floors[0]?.id);
      const floorObj = proj.floors.find(f => f.id === defaultFloor) || proj.floors[0];
      const defaultZone = d ? d.zone : (floorObj?.zones[0]?.name || '');

      tempModalBeforeImg = d?.beforeImg || null;
      tempModalAfterImg = d?.afterImg || null;

      openModal(`
        <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
          <h3 class="font-bold text-base">${d ? `✏️ แก้ไข Defect ข้อที่ #${d.number}` : '➕ เพิ่มรายการ Defect ใหม่'}</h3>

    function syncModalZoneOptions() {
      const proj = getActiveProject();
      const flId = document.getElementById('dmFloor')?.value;
      const fl = proj?.floors.find(f => f.id === flId);
      const list = document.getElementById('dmZoneList');
      if (list && fl) {
        list.innerHTML = fl.zones.map(z => `<option value="${escapeHtml(z.name)}"></option>`).join('');
      }
    }

    async function handleModalPhotoUpload(event, side) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const compressed = await compressImageFile(file, 960, 0.75);
        if (side === 'before') {
          tempModalBeforeImg = compressed;
          document.getElementById('dmBeforeImg').src = compressed;
          document.getElementById('dmBeforeImg').classList.remove('hidden');
          document.getElementById('dmBeforeEmpty').classList.add('hidden');
          document.getElementById('dmBtnDelBefore').classList.remove('hidden');
        } else {
          tempModalAfterImg = compressed;
          document.getElementById('dmAfterImg').src = compressed;
          document.getElementById('dmAfterImg').classList.remove('hidden');
          document.getElementById('dmAfterEmpty').classList.add('hidden');
          document.getElementById('dmBtnDelAfter').classList.remove('hidden');
        }
      } catch (e) {
        showToast('ไม่สามารถอ่านไฟล์รูปภาพได้', 'danger');
      }
      event.target.value = '';
    }

    function clearModalTempPhoto(side) {
      if (side === 'before') {
        tempModalBeforeImg = null;
        document.getElementById('dmBeforeImg').src = '';
        document.getElementById('dmBeforeImg').classList.add('hidden');
        document.getElementById('dmBeforeEmpty').classList.remove('hidden');
        document.getElementById('dmBtnDelBefore').classList.add('hidden');
      } else {
        tempModalAfterImg = null;
        document.getElementById('dmAfterImg').src = '';
        document.getElementById('dmAfterImg').classList.add('hidden');
        document.getElementById('dmAfterEmpty').classList.remove('hidden');
        document.getElementById('dmBtnDelAfter').classList.add('hidden');
      }
    }

    function saveDefectEditModal() {
      const proj = getActiveProject();
      if (!proj) return;
      const id = document.getElementById('dmId')?.value || '';
      const title = (document.getElementById('dmTitle')?.value || '').trim();
      if (!title) {
        showToast('กรุณากรอกหัวข้อรายการ Defect', 'warning');
        return;
      }
      const floorId = document.getElementById('dmFloor')?.value || proj.floors[0]?.id;
      const zone = (document.getElementById('dmZone')?.value || '').trim() || 'ไม่ระบุโซน';
      const severity = normalizeSeverity(document.getElementById('dmSeverity')?.value);
      const status = document.getElementById('dmStatus')?.value || 'รอแก้ไข';
      const cause = (document.getElementById('dmCause')?.value || '').trim();
      const solution = (document.getElementById('dmSolution')?.value || '').trim();

      if (id) {
        const d = proj.defects.find(x => x.id === id);
        if (d) {
          d.title = title;
          d.floorId = floorId;
          d.zone = zone;
          d.severity = severity;
          d.status = status;
          d.cause = cause;
          d.solution = solution;
          d.hideCause = !cause;
          d.hideSolution = !solution;
          d.beforeImg = tempModalBeforeImg;
          d.afterImg = tempModalAfterImg;
        }
      } else {
        const nextNum = proj.defects.length > 0 ? Math.max(...proj.defects.map(x => x.number || 0)) + 1 : 1;
        proj.defects.push({
          id: 'def_' + Date.now(),
          number: nextNum,
          floorId,
          zone,
          x: 50,
          y: 50,
          title,
          cause,
          solution,
          hideCause: !cause,
          hideSolution: !solution,
          severity,
          status,
          beforeImg: tempModalBeforeImg,
          afterImg: tempModalAfterImg,
          createdAt: new Date().toISOString().split('T')[0]
        });
      }

      saveAllToLocalStorage(false);
      closeModal();
      showToast('บันทึกรายการ Defect และรูปภาพเรียบร้อยแล้ว', 'success');
      renderApp();
    }

          <!-- Project Metadata -->
          <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:14px; background:#f8fafc;">
            <tr>
              <td style="border:1px solid #e2e8f0; padding:6px 8px;"><strong>โครงการ:</strong> ${escapeHtml(proj.name)}</td>
              <td style="border:1px solid #e2e8f0; padding:6px 8px;"><strong>บ้านเลขที่:</strong> ${escapeHtml(proj.houseNo)}</td>
            </tr>
            <tr>
              <td style="border:1px solid #e2e8f0; padding:6px 8px;"><strong>ที่อยู่:</strong> ${escapeHtml(proj.address)}</td>
              <td style="border:1px solid #e2e8f0; padding:6px 8px;"><strong>วันที่ตรวจ:</strong> ${escapeHtml(proj.inspectionDate)}</td>
            </tr>
          </table>

          <!-- Summary Stats -->
          <div style="font-size:12px; margin-bottom:14px; padding:8px 10px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px;">
            <strong>สรุปผลการตรวจสอบ:</strong>
            รายการทั้งหมด <strong>${total}</strong> ข้อ &nbsp;|&nbsp;
            ระดับเร่งด่วน <strong style="color:#dc2626;">${urgent}</strong> ข้อ &nbsp;|&nbsp;
            รอ/กำลังแก้ไข <strong style="color:#d97706;">${pending}</strong> ข้อ &nbsp;|&nbsp;
            แก้ไขแล้ว <strong style="color:#059669;">${fixed}</strong> ข้อ
          </div>

          ${floorPlansSection}

          <!-- Defect Table -->
          <h3 style="font-size:15px; font-weight:700; color:${b.accentColor}; border-bottom:2px solid ${b.accentColor}; padding-bottom:4px; margin-bottom:10px;">รายละเอียดรายการตรวจสอบ (Defect List)</h3>
          <table style="width:100%; border-collapse:collapse; font-size:12px;">
            <thead>
              <tr style="background:#f1f5f9;">
                <th style="border:1px solid #cbd5e1; padding:6px; width:40px;">ข้อ</th>
                <th style="border:1px solid #cbd5e1; padding:6px;">รายการ Defect / สาเหตุ / วิธีแก้ไข</th>
                <th style="border:1px solid #cbd5e1; padding:6px; width:85px;">ระดับ / สถานะ</th>
                <th style="border:1px solid #cbd5e1; padding:6px; width:145px;">ก่อนแก้ไข (Before)</th>
                <th style="border:1px solid #cbd5e1; padding:6px; width:145px;">หลังแก้ไข (After)</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows || '<tr><td colspan="5" style="border:1px solid #cbd5e1; padding:16px; text-align:center;">ไม่มีรายการ Defect</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    function exportProjectPDF() {
      const proj = getActiveProject();
      if (!proj) return;
      const printArea = document.getElementById('printArea');
      if (!printArea) return;
      printArea.innerHTML = buildPrintableReportHtml(proj, false);
      showToast('กำลังเปิดหน้าต่างพิมพ์ / บันทึกเป็น PDF...', 'info');
      setTimeout(() => window.print(), 250);
    }

    function exportProjectWord() {
      const proj = getActiveProject();
      if (!proj) return;
      const html = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>${escapeHtml(proj.name)}</title></head>
        <body>${buildPrintableReportHtml(proj, true)}</body></html>`;
      const blob = new Blob(['\ufeff', html], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeSlug = (proj.houseNo || 'Report').replace(/[^a-zA-Z0-9ก-๙_-]/g, '_');
      a.download = `Inspection_Report_${safeSlug}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('ดาวน์โหลดรายงาน Word (.doc) เรียบร้อยแล้ว', 'success');
    }

    function exportProjectExcel() {
      const proj = getActiveProject();
      if (!proj) return;
      const sorted = [...proj.defects].sort((a, b) => (a.number || 0) - (b.number || 0));
      const rows = sorted.map(d => ({
        'ข้อที่': d.number,
        'ชั้น': getFloorNameById(proj, d.floorId),
        'โซน': d.zone,
        'รายการ Defect': d.title,
        'สาเหตุทางวิศวกรรม': d.hideCause ? '' : (d.cause || ''),
        'วิธีแก้ไข': d.hideSolution ? '' : (d.solution || ''),
        'ความรุนแรง': d.severity,
        'สถานะ': d.status,
        'รูปก่อนแก้ไข (Before)': d.beforeImg ? 'มีรูปภาพ' : 'ไม่มี',
        'รูปหลังแก้ไข (After)': d.afterImg ? 'มีรูปภาพ' : 'ไม่มี'
      }));

      const safeSlug = (proj.houseNo || 'Report').replace(/[^a-zA-Z0-9ก-๙_-]/g, '_');
      if (typeof XLSX !== 'undefined') {
        try {
          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Defect List');
          XLSX.writeFile(wb, `Inspection_Report_${safeSlug}.xlsx`);
          showToast('ดาวน์โหลดรายงาน Excel (.xlsx) เรียบร้อยแล้ว', 'success');
          return;
        } catch (err) {
          console.warn('XLSX export error, falling back to CSV:', err);
        }
      }

      // Graceful CSV Fallback (UTF-8 BOM)
      const headers = Object.keys(rows[0] || { 'ข้อที่': '' });
      const csvLines = [
        headers.join(','),
        ...rows.map(r => headers.map(h => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))
      ];
      const blob = new Blob(['\ufeff' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Inspection_Report_${safeSlug}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('ดาวน์โหลดรายงานเป็นไฟล์ CSV สำรองเรียบร้อยแล้ว', 'info');
    }

    /*************************************************************************
     * 13. MAIN RENDER LOOP & INITIALIZATION
     *************************************************************************/
    function renderApp() {
      const root = document.getElementById('appRoot');
      if (!root) return;
      applyBrandTheme();

      const activeProj = getActiveProject();
      if (!activeProj) {
        root.innerHTML = renderProjectHubHtml();
      } else {
        root.innerHTML = renderProjectWorkspaceHtml(activeProj);
        if (appState.activeTab === 'studio') {
          requestAnimationFrame(() => bindMarkupCanvasEvents());
        }
      }
    }

    window.addEventListener('resize', () => {
      if (appState.activeProjectId && appState.activeTab === 'studio' && appState.markup.imageSrc) {
        bindMarkupCanvasEvents();
      }
    });

    window.onload = function () {
      applyBrandTheme();
      renderApp();
    };
  </script>
</body>
</html>
