<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://geleptwbxjoumxyxbhqa.supabase.co; base-uri 'none'; form-action 'none'"><title>ลืมรหัสผ่าน | TEAM INSPECTION PRO ELITE</title><style>*{box-sizing:border-box}body{background:#eef3f8;margin:0;font:15px system-ui;color:#182b43}main{max-width:460px;margin:8vh auto;padding:24px;background:white;border-radius:16px;border-top:4px solid #123a68;box-shadow:0 10px 40px #152b4318}h1{font-size:21px;color:#123a68}h2{font-size:18px}label{display:block;margin:14px 0 5px}input,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #bdcbd9;width:100%}button{margin-top:15px;background:#165da5;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}small{color:#64748b}a{color:#165da5}#status{overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:480px){main{margin:18px 12px}}</style></head><body><main><h1>TEAM INSPECTION PRO ELITE</h1><section id="request"><h2>ลืมรหัสผ่าน?</h2><p>กรอกอีเมลที่ลงทะเบียนไว้เพื่อขอลิงก์ตั้งรหัสผ่านใหม่</p><form id="requestForm"><label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" required><button id="send">ส่งลิงก์รีเซ็ตรหัสผ่าน</button></form><p><small>เปิดลิงก์จากอีเมลด้วยเบราว์เซอร์และโปรไฟล์เดียวกับที่ขอรีเซ็ต ตรวจสอบโฟลเดอร์สแปม หากไม่ได้รับอีเมลให้ติดต่อผู้ดูแล</small></p></section><section id="reset" hidden><h2>ตั้งรหัสผ่านใหม่</h2><form id="resetForm"><label for="newPassword">รหัสผ่านใหม่</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">ยืนยันรหัสผ่านใหม่</label><input id="confirm" type="password" autocomplete="new-password" required><button id="save">บันทึกรหัสผ่านใหม่
