<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEAM INSPECTION PRO ELITE</title></head><body style="font:16px system-ui;padding:24px"><h1>TEAM INSPECTION PRO ELITE</h1><p id="status">กำลังเปิดหน้าเข้าสู่ระบบเดียว...</p><script>
(async()=>{try{const root=location.pathname.replace(/(?:versions\/v1\.0\.\d+\/)?auth-preview\.html$/,'');const r=await fetch(root+'release-index.json',{cache:'no-store'});if(!r.ok)throw Error();const m=await r.json();const release=m.releases.find(x=>x.version===m.latest&&/^v1\.0\.\d+$/.test(x.version)&&x.storageSchema===2);if(!release)throw Error();location.replace(root+'versions/'+release.version+'/');}catch{document.getElementById('status').textContent='ไม่สามารถเปิดหน้าเข้าสู่ระบบได้ โปรดลองโหลดใหม่';}})();
</script></body></html>
